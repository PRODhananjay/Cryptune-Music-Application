name: Cryptune CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

  ECR_FRONTEND_REPOSITORY: cryptune-frontend
  ECR_BACKEND_REPOSITORY: cryptune-backend

  ECS_CLUSTER: cryptune-cluster
  ECS_SERVICE: cryptune-service

  ECS_TASK_DEFINITION: cryptune-task


jobs:

  # =====================================================
  # TEST
  # =====================================================

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # -----------------------------
      # Frontend
      # -----------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # -----------------------------
      # Backend
      # -----------------------------

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend syntax check
        working-directory: backend
        run: node --check src/server.js


  # =====================================================
  # BUILD + PUSH DOCKER IMAGES
  # =====================================================

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - test

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      # =================================================
      # AWS AUTHENTICATION
      # =================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # =================================================
      # LOGIN TO ECR
      # =================================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # =================================================
      # IMAGE VARIABLES
      # =================================================

      - name: Set image variables
        id: image
        run: |

          echo "registry=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_OUTPUT

          echo "frontend_image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${GITHUB_SHA}" >> $GITHUB_OUTPUT

          echo "backend_image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${GITHUB_SHA}" >> $GITHUB_OUTPUT


      # =================================================
      # BUILD FRONTEND
      # =================================================

      - name: Build frontend Docker image
        run: |
          docker build \
            -t "${{ steps.image.outputs.frontend_image }}" \
            ./frontend


      # =================================================
      # BUILD BACKEND
      # =================================================

      - name: Build backend Docker image
        run: |
          docker build \
            -t "${{ steps.image.outputs.backend_image }}" \
            ./backend


      # =================================================
      # PUSH FRONTEND
      # =================================================

      - name: Push frontend image
        run: |
          docker push "${{ steps.image.outputs.frontend_image }}"


      # =================================================
      # PUSH BACKEND
      # =====================================================

      - name: Push backend image
        run: |
          docker push "${{ steps.image.outputs.backend_image }}"


  # =====================================================
  # DEPLOY TO ECS
  # =====================================================

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      # =================================================
      # AWS AUTHENTICATION
      # =================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # =================================================
      # LOGIN TO ECR
      # =================================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # =================================================
      # GET IMAGE NAMES
      # =================================================

      - name: Set image variables
        id: image
        run: |

          echo "frontend_image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${GITHUB_SHA}" >> $GITHUB_OUTPUT

          echo "backend_image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${GITHUB_SHA}" >> $GITHUB_OUTPUT


      # =================================================
      # GET CURRENT ECS TASK DEFINITION
      # =================================================

      - name: Download ECS task definition
        run: |

          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION }} \
            --query taskDefinition \
            > task-definition.json


      # =================================================
      # UPDATE FRONTEND IMAGE
      # =================================================

      - name: Update frontend image
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: frontend
          image: ${{ steps.image.outputs.frontend_image }}


      # =================================================
      # UPDATE BACKEND IMAGE
      # =================================================

      - name: Update backend image
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          container-name: backend
          image: ${{ steps.image.outputs.backend_image }}


      # =================================================
      # DEPLOY TASK DEFINITION
      # =================================================

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true


      # =================================================
      # DEPLOYMENT COMPLETE
      # =================================================

      - name: Deployment successful
        run: |
          echo "====================================="
          echo "Cryptune deployment successful!"
          echo "====================================="
          echo "Commit: ${GITHUB_SHA}"
          echo "Frontend: ${{ steps.image.outputs.frontend_image }}"
          echo "Backend:  ${{ steps.image.outputs.backend_image }}"